name: Pipeline CI/CD - Grafo

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
#ci
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Checkout do código
      uses: actions/checkout@v4

    - name: 2. Configurar o ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov

    - name: 4. Executar Testes Unitários
      env:
        PYTHONPATH: .
      run: pytest tests/unitarios/

    - name: 5. Executar Testes de Integração
      env:
        PYTHONPATH: .
      run: pytest tests/integracao/

    - name: 6. Gerar Relatório de Cobertura
      env:
        PYTHONPATH: .
      run: pytest tests/ --cov=app
#mock cd se precisar
  deploy:
    needs: build-and-test 
    runs-on: ubuntu-latest
    steps:
    - name: 1. Checkout do código
      uses: actions/checkout@v4
      
    - name: 2. Simular Empacotamento e Entrega (Deploy)
      run: |
        echo "Iniciando Entrega Contínua..."
        echo "Testes da etapa de CI passaram com sucesso."
        echo "Empacotando o módulo 'Grafo' para distribuição."
        echo "Simulando o deploy em ambiente de homologação/produção..."
        echo "Deploy concluído com sucesso"