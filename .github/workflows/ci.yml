name: Pipeline de CI - Testes do Grafo

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest 

    steps:
    - name: 1. Checkout do código
      uses: actions/checkout@v3

    - name: 2. Configurar o ambiente Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' # 

    - name: 3. Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        # Se você tiver um requirements.txt, ele instala aqui também:
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 4. Executar Testes Unitários
      env:
        PYTHONPATH: .
      run: |
        pytest tests/unitarios/

    - name: 5. Executar Testes de Integração
      env:
        PYTHONPATH: .
      run: |
        pytest tests/integracao/

    - name: 6. Gerar Relatório de Cobertura Geral
      env:
        PYTHONPATH: .
      run: |
        pytest tests/ --cov=app